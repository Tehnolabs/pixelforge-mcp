[project]
name = "pixelforge-mcp"
version = "0.6.0"
description = "AI-powered image generation MCP server with multi-model support"
authors = [{name = "Ahmed Al-Eryani", email = "ahmed@tehnolabs.com"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
keywords = ["mcp", "image-generation", "gemini", "ai", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries",
    "Framework :: Pydantic :: 2",
]

dependencies = [
    "certifi>=2026.10.19",
    "fastmcp>=3.1.0,<5.0.0",
    "google-genai>=1.62.0,<3.0.0",
    "pillow>=10.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.24.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.12",
]
# Kept for compatibility with `pip install pixelforge-mcp[vertex]`.
# The Vertex AI backend needs no extra packages: google-genai talks to
# Vertex AI directly using Application Default Credentials.
vertex = []

[project.urls]
Homepage = "https://github.com/tehnolabs/pixelforge-mcp"
Repository = "https://github.com/tehnolabs/pixelforge-mcp"
"Bug Tracker" = "https://github.com/tehnolabs/pixelforge-mcp/issues"

[project.scripts]
pixelforge-mcp = "pixelforge_mcp.server:main"

[tool.setuptools.package-data]
pixelforge_mcp = ["templates/*.yaml"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py310', 'py311']

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
