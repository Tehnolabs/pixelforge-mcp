# PixelForge MCP Server Configuration
# Copy this file to config.yaml and customize as needed

# Image generation settings
imagen:
  # Google API Key (can also set via GOOGLE_API_KEY environment variable)
  api_key: null

  # Default model for generation
  default_model: "gemini-nano-banana-2.1"

  # Default aspect ratio for images
  default_aspect_ratio: "1:1"

  # Default temperature (creativity) level
  default_temperature: 0.7

  # Safety filter setting
  safety_setting: "preset:strict"

# Storage configuration
storage:
  # Directory for generated images
  output_dir: "./generated_images"

  # S3 storage (optional)
  use_s3: false
  s3_bucket: null
  s3_prefix: ""

# Server configuration
server:
  name: "pixelforge-mcp"
  version: "0.7.0"
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  timeout: 120  # CLI command timeout in seconds

# Vertex AI backend (optional). Every tool can run through Vertex AI instead
# of an API key. Credentials come from Application Default Credentials
# (GOOGLE_APPLICATION_CREDENTIALS or `gcloud auth application-default login`).
vertex:
  # Google Cloud project ID (can also set via GOOGLE_CLOUD_PROJECT)
  project_id: null

  # Use the project above. GOOGLE_CLOUD_PROJECT sets this automatically.
  enabled: false

  # Vertex AI location (can also set via GOOGLE_CLOUD_LOCATION).
  # The current Gemini image and text models are served from the global endpoint.
  location: "global"

  # Use Vertex AI even when an API key is also configured (can also set via
  # GOOGLE_GENAI_USE_VERTEXAI=true or GOOGLE_GENAI_USE_ENTERPRISE=true).
  # Otherwise the API key wins.
  prefer: false
