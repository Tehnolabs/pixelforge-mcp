name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: black --check src/ tests/

      - name: Type check
        run: mypy src/

      - name: Unit tests
        run: pytest tests/unit/ -q

  # Live API tests. Forks cannot read repository secrets, so pull requests
  # from forks skip this job and run the unit checks only.
  integration:
    needs: test
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The expressions evaluate to the literal strings "true"/"false";
      # no secret value reaches the shell or the job environment.
      - name: Detect credentials
        id: creds
        run: |
          if [ "${{ secrets.GCP_SERVICE_ACCOUNT_KEY != '' }}" = "true" ]; then
            echo "mode=vertex" >> "$GITHUB_OUTPUT"
          elif [ "${{ secrets.GOOGLE_API_KEY != '' }}" = "true" ]; then
            echo "mode=api_key" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      # Masks must be registered before the auth step exports the project
      # variables: every later step echoes its environment into the log.
      # The key JSON holds the project ID and the service account email but
      # not the project number, which Google's 403/429 text uses; that comes
      # from the optional GCP_PROJECT_NUMBER secret.
      - name: Mask project identifiers
        if: steps.creds.outputs.mode == 'vertex'
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
        run: |
          for field in project_id client_email; do
            value="$(jq -r --arg f "$field" '.[$f] // empty' <<< "$GCP_SERVICE_ACCOUNT_KEY")"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          done
          if [ -n "$GCP_PROJECT_NUMBER" ]; then
            echo "::add-mask::$GCP_PROJECT_NUMBER"
          fi

      # Exports GOOGLE_CLOUD_PROJECT and GOOGLE_APPLICATION_CREDENTIALS,
      # which select the Vertex AI backend.
      - name: Authenticate to Google Cloud
        if: steps.creds.outputs.mode == 'vertex'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      # Fallback when no project number secret is set and the service
      # account may read the project.
      - name: Mask project number
        if: steps.creds.outputs.mode == 'vertex'
        run: |
          number="$(gcloud projects describe "$GOOGLE_CLOUD_PROJECT" --format='value(projectNumber)' 2>/dev/null || true)"
          if [ -n "$number" ]; then
            echo "::add-mask::$number"
          fi

      # --show-capture=no keeps captured logs out of the job log on failure;
      # only the assertion message is printed.
      - name: Integration tests (Vertex AI)
        if: steps.creds.outputs.mode == 'vertex'
        env:
          GOOGLE_CLOUD_LOCATION: global
        run: pytest tests/integration -q -m integration --show-capture=no

      - name: Integration tests (Gemini API)
        if: steps.creds.outputs.mode == 'api_key'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: pytest tests/integration -q -m integration --show-capture=no

      - name: No credentials
        if: steps.creds.outputs.mode == 'none'
        run: echo "Neither GCP_SERVICE_ACCOUNT_KEY nor GOOGLE_API_KEY is set; integration tests skipped."
