name: Gemini Review

on:
  workflow_call:
    inputs:
      additional_context:
        type: string
        description: Additional context from the review request
        required: false

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The action pipes the prompt to the CLI verbatim, so values are
      # interpolated here with workflow expressions rather than shell variables.
      # On issue_comment events the PR number is under issue.number.
      - name: Run Gemini PR review
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ${{ github.token }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          upload_artifacts: true
          # The default flash model ended the review with MALFORMED_FUNCTION_CALL
          # before calling any tool; the pro model handles the MCP tool schemas.
          gemini_model: gemini-3.1-pro-preview
          github_pr_number: ${{ github.event.pull_request.number || github.event.issue.number }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 50
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run", "-i", "--rm",
                    "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": []
              }
            }
          prompt: |-
            You are a code reviewer for pixelforge-mcp, a Python MCP server
            for AI-powered image generation using Google Gemini models.

            Repository: ${{ github.repository }}
            Pull request number: ${{ github.event.pull_request.number || github.event.issue.number }}

            Use the GitHub MCP tools for everything below. Do not run shell commands.

            1. Call `pull_request_read` with method `get` for the title and description,
               then with method `get_diff` for the changes.
            2. Use the built-in file tools to read any changed file that needs more context.
            3. Analyze the changes for:
               - Correctness and potential bugs
               - Security issues (API key handling, input validation)
               - Python best practices and type safety
               - Test coverage gaps
            4. Call `pull_request_review_write` with method `create` to open a pending review.
            5. For each finding, call `add_comment_to_pending_review` on the changed line.
               Start the comment with a severity tag: [Critical], [High], [Medium] or [Low].
               Comment only on lines that appear in the diff.
            6. Call `pull_request_review_write` with method `submit_pending`, event `COMMENT`,
               and a short summary. Never use APPROVE or REQUEST_CHANGES.
            7. If there are no findings, still submit the review with a short summary.

            Additional context from the reviewer: ${{ inputs.additional_context }}
